group=com.fastasyncworldedit

# ---------------------------------------------------------------------------
# Folia fork configuration
# ---------------------------------------------------------------------------
# Folia stable release this fork targets. Both `dev.folia:folia-api` and `dev.folia:dev-bundle`
# are published under this exact version. Folia is a regionised multithreaded Paper fork: there is
# no single main thread, and `BukkitScheduler` is unsupported.
foliaVersion=26.1.2.build.8-stable

org.gradle.jvmargs=-Xmx1512M
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.caching=true

loom_fabric_repository=https://maven.enginehub.org/artifactory/fabricmc/
loom_libraries_base=https://maven.enginehub.org/artifactory/minecraft/

